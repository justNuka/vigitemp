name: Temporary release readiness validation

on:
  push:
    branches:
      - fix/license-telephony-seed-readiness

permissions:
  contents: read

jobs:
  web-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma MySQL clients
        working-directory: website
        run: pnpm prisma:generate:mysql
      - name: TypeScript
        working-directory: website
        run: pnpm exec tsc --noEmit
      - name: ESLint
        working-directory: website
        run: pnpm lint
      - name: i18n parity
        working-directory: website
        run: pnpm i18n:check
      - name: License option helper smoke
        working-directory: website
        run: |
          pnpm exec tsx -e 'import assert from "node:assert/strict"; import { hasLicenseOption } from "./src/lib/license-access.ts"; assert.equal(hasLicenseOption({edition:"one",options:["telephonie"]},"telephonie"),true); assert.equal(hasLicenseOption({edition:"expert",options:[]},"telephonie"),false); assert.equal(hasLicenseOption({edition:"pack",options:[" TELEPHONIE "]},"telephonie"),true); console.log("license option helper: OK")'
      - name: Verify telephony admin routes are license-gated
        working-directory: website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          routes = sorted(Path('src/app/api/admin/telephony').rglob('route.ts'))
          if not routes:
              raise SystemExit('No telephony admin routes found')
          missing = []
          for route in routes:
              text = route.read_text(encoding='utf-8')
              if 'requireTelephonyLicense' not in text:
                  missing.append(str(route))
          print(f'Checked {len(routes)} telephony admin routes')
          if missing:
              raise SystemExit('Missing telephony license guard: ' + ', '.join(missing))
          PY

  seed-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
      - name: Execute complete MySQL seed
        run: mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -prootpass < db/vigisensys_seed.sql
      - name: Verify Better Auth and metrology schema
        run: |
          mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -prootpass -N -e "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA='vigi_main' AND TABLE_NAME IN ('t_auth_user','t_auth_session','t_auth_account','t_auth_verification') ORDER BY TABLE_NAME; SELECT COLUMN_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='vigi_main' AND TABLE_NAME='t_ajustage' AND COLUMN_NAME='Coeffs_Modifies_Depuis_Derniere_Mesure'; SELECT Valeur FROM vigi_main.t_parametre WHERE Section='VERSION' AND Mot_Cle='SCHEMA_VERSION';"

  seed-mssql:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: "VigiSensys-Seed-2026!"
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "VigiSensys-Seed-2026!"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - name: Wait for SQL Server and locate sqlcmd
        run: |
          CID=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format '{{.ID}}' | head -n1)
          test -n "$CID"
          SQLCMD=""
          for candidate in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
            if docker exec "$CID" test -x "$candidate"; then
              SQLCMD="$candidate"
              break
            fi
          done
          if [ -z "$SQLCMD" ]; then
            echo "sqlcmd not present in SQL Server image" >&2
            exit 1
          fi
          echo "CID=$CID" >> "$GITHUB_ENV"
          echo "SQLCMD=$SQLCMD" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if docker exec "$CID" "$SQLCMD" -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready" >&2
          exit 1
      - name: Execute complete SQL Server seed
        run: docker exec -i "$CID" "$SQLCMD" -S localhost -U sa -P "$SA_PASSWORD" -C -b < db/vigisensys_seed_mssql.sql
      - name: Verify Better Auth and metrology schema
        run: |
          cat <<'SQL' | docker exec -i "$CID" "$SQLCMD" -S localhost -U sa -P "$SA_PASSWORD" -C -b
          USE [vigi_main];
          SELECT [name] FROM sys.tables WHERE [name] IN ('t_auth_user','t_auth_session','t_auth_account','t_auth_verification') ORDER BY [name];
          SELECT COL_NAME(OBJECT_ID(N'dbo.t_ajustage'), COLUMNPROPERTY(OBJECT_ID(N'dbo.t_ajustage'), N'Coeffs_Modifies_Depuis_Derniere_Mesure', 'ColumnId')) AS adjustment_dirty_column;
          SELECT [Valeur] FROM dbo.[t_parametre] WHERE [Section]=N'VERSION' AND [Mot_Cle]=N'SCHEMA_VERSION';
          GO
          SQL
