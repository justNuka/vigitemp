name: Agent finalize adjustment PR documentation

on:
  push:
    branches:
      - agent/adjustment-acquisition-stability-flow

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adjustment-acquisition-stability-flow
          fetch-depth: 0

      - name: Update persistent documentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('website/docs/metrology-adjustment-acquisition-flow-28-08-2026.md'): [
                  (
                      '**EN COURS — branche `agent/adjustment-acquisition-stability-flow` — base `dev` `156da60c3847ee751fa3ad7077b35f4bdd505c02`.**',
                      '**PR OUVERTE — PR #70 — branche `agent/adjustment-acquisition-stability-flow` — base `dev` `156da60c3847ee751fa3ad7077b35f4bdd505c02`.**',
                  ),
                  (
                      '- [ ] lancer `pnpm lint`, `pnpm i18n:check` et `pnpm build`.',
                      '- [x] validations techniques : lint sans erreur bloquante, nouveau flux FR/EN contrôlé, TypeScript OK après génération Prisma et `pnpm build` Next.js OK en GitHub Actions.',
                  ),
              ],
              Path('website/docs/backlog-retours-17-08-2026.md'): [
                  (
                      'Statut : **`PR_OUVERTE` — branche `agent/gsp-econ-60-char-limit` — PR #69 vers `dev`**.',
                      'Statut : **`CORRIGE_DEV` — PR #69 — merge `156da60c3847ee751fa3ad7077b35f4bdd505c02`**.',
                  ),
                  (
                      'Statut : **`EN_COURS` — branche `agent/adjustment-acquisition-stability-flow` — PR à ouvrir vers `dev`**.',
                      'Statut : **`PR_OUVERTE` — branche `agent/adjustment-acquisition-stability-flow` — PR #70 vers `dev`**.',
                  ),
                  (
                      '- [ ] lancer lint, i18n check et build Web.',
                      '- [x] validations techniques : lint sans erreur bloquante, nouveau flux FR/EN contrôlé, TypeScript OK après génération Prisma et build Web Next.js OK en GitHub Actions.',
                  ),
              ],
              Path('website/docs/metrology-retours-26-08-2026.md'): [
                  (
                      'Le flux est repris sur `agent/adjustment-acquisition-stability-flow` depuis `dev` `156da60c3847ee751fa3ad7077b35f4bdd505c02` après merge de la PR #69. Le détail d’implémentation et la checklist de reprise sont centralisés dans `website/docs/metrology-adjustment-acquisition-flow-28-08-2026.md`.',
                      'Le flux est repris sur `agent/adjustment-acquisition-stability-flow` depuis `dev` `156da60c3847ee751fa3ad7077b35f4bdd505c02` après merge de la PR #69. La PR #70 est ouverte vers `dev`. Le détail d’implémentation et la checklist de reprise sont centralisés dans `website/docs/metrology-adjustment-acquisition-flow-28-08-2026.md`.',
                  ),
              ],
          }

          for path, items in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in items:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'{path}: expected exactly one occurrence, got {count}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit documentation and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f '.github/workflows/agent-finalize-adjustment-docs.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: mark adjustment acquisition PR open'
          git push origin HEAD:agent/adjustment-acquisition-stability-flow