name: Temporary admin backup bilingual validation

on:
  push:
    branches:
      - fix/admin-backup-log-bilingual

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql
      - name: Backup parser regression
        run: pnpm test:admin-nav-backup-status
      - name: ESLint targeted
        run: pnpm exec eslint "src/lib/backup-log-parser.ts" "src/app/api/admin/sauvegardes/route.ts" "scripts/test-admin-nav-backup-status.ts"
      - name: Production build - MySQL
        run: pnpm build
      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql
      - name: TypeScript - SQL Server
        run: pnpm exec tsc --noEmit
