name: TEMP Better Auth foundation

on:
  push:
    branches:
      - feature/better-auth-runtime-foundation

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/better-auth-runtime-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Refresh lockfile
        working-directory: website
        run: pnpm install --lockfile-only

      - name: Commit lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- website/pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/pnpm-lock.yaml
          git commit -m "build(auth): actualiser le lockfile Better Auth"
          git push origin HEAD:feature/better-auth-runtime-foundation

      - name: Install frozen dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma MySQL clients
        working-directory: website
        run: pnpm prisma:generate:mysql

      - name: TypeScript
        working-directory: website
        run: pnpm exec tsc --noEmit

      - name: ESLint Better Auth lot
        working-directory: website
        run: >-
          pnpm exec eslint
          src/lib/better-auth/auth.ts
          src/lib/better-auth/database.ts
          src/lib/better-auth/vigisensys-identity.ts
          src/app/api/auth-v2/[...all]/route.ts
          scripts/test-better-auth-foundation.ts
