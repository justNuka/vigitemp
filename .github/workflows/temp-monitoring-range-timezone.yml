name: Temporary monitoring range timezone validation

on:
  push:
    branches:
      - fix/monitoring-range-timezone

permissions:
  contents: read

concurrency:
  group: temp-monitoring-range-timezone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: website
    env:
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/vigisensys
      DATABASE_MESURES_URL: mysql://root:password@127.0.0.1:3306/vigisensys_mesures
      DATABASE_CHAT_URL: mysql://root:password@127.0.0.1:3306/vigisensys_chat
      JWT_SECRET: temporary-ci-secret-that-is-long-enough-for-validation
      BETTER_AUTH_SECRET: temporary-ci-better-auth-secret-that-is-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD

      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Canonical date helper tests
        run: pnpm test:date-display

      - name: Surveillance timezone regression
        run: pnpm test:surveillance-measurement-timezone

      - name: ESLint targeted
        run: >-
          pnpm exec eslint
          "src/lib/date-display.ts"
          "src/lib/sql-provider.ts"
          "src/app/api/mesures/[idLieu]/route.ts"
          "src/app/api/alarmes/range/route.ts"
          "src/app/api/alarmes/route.ts"
          "src/app/api/alarmes/[id]/route.ts"
          "src/app/api/alarmes/acknowledgement-candidates/route.ts"
          "src/app/api/capteurs/paginated/route.ts"
          "src/app/[locale]/(dashboard)/server-dashboard.tsx"
          "scripts/test-surveillance-measurement-timezone.ts"

      - name: TypeScript MySQL
        run: pnpm exec tsc --noEmit

      - name: i18n check (no new debt in changed sources)
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'date-display|sql-provider|api/mesures|api/alarmes|capteurs/paginated|server-dashboard' /tmp/i18n-check.log; then
            echo "New i18n debt detected in a changed source."
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "Global i18n checker still reports only pre-existing debt outside this lot."
          fi

      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql

      - name: TypeScript SQL Server
        env:
          DATABASE_PROVIDER: mssql
          DATABASE_URL: "sqlserver://localhost:1433;database=vigisensys;user=sa;password=TemporaryPass123!;encrypt=false;trustServerCertificate=true"
          DATABASE_MESURES_URL: "sqlserver://localhost:1433;database=vigisensys_mesures;user=sa;password=TemporaryPass123!;encrypt=false;trustServerCertificate=true"
          DATABASE_CHAT_URL: "sqlserver://localhost:1433;database=vigisensys_chat;user=sa;password=TemporaryPass123!;encrypt=false;trustServerCertificate=true"
        run: pnpm exec tsc --noEmit

      - name: Restore Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Production build
        run: pnpm build
