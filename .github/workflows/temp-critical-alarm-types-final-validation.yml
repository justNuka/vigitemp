name: Temporary critical alarm types final validation

on:
  push:
    branches:
      - feature/critical-alarm-types

jobs:
  validate-web-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql
      - name: Critical alarm type contract
        run: pnpm test:critical-alarm-types
      - name: Critical threshold regression
        run: pnpm test:location-critical-thresholds
      - name: Alarm email regression
        run: pnpm test:alarm-email-notifications
      - name: Alarm acknowledgement regression
        run: pnpm test:alarm-acknowledgement-context
      - name: ESLint targeted
        run: pnpm exec eslint "src/lib/alarm-types.ts" "src/lib/alarm-email.ts" "src/components/monitoring-card.tsx" "src/components/monitoring-card/monitoring-card-header.tsx" "src/components/global-app-effects.tsx" "src/app/api/alarmes/route.ts" "src/app/api/alarmes/[id]/route.ts" "src/app/api/alarmes/dispatch/route.ts" "src/app/api/alarmes/acknowledgement-candidates/route.ts" "src/app/api/alarmes/acquittements/route.ts" "src/app/api/capteurs/paginated/route.ts" "src/app/[locale]/(dashboard)/server-dashboard.tsx" "src/app/[locale]/(dashboard)/alarmes/server-alarms.tsx" "src/app/[locale]/(dashboard)/surveillance/server-stats.ts" "src/lib/statistics/location-stats.ts" "scripts/test-critical-alarm-types.ts"
      - name: i18n check
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "alarm-types|monitoring-card-header|server-dashboard|server-alarms|test-critical-alarm-types" /tmp/i18n-check.log; then
            echo "New i18n debt detected in files changed by this lot."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Global i18n checker reports pre-existing debt outside this lot."
          fi
      - name: Production build - MySQL
        run: pnpm build
      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql
      - name: TypeScript - SQL Server
        run: pnpm exec tsc --noEmit

  validate-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Restore legacy packages
        shell: pwsh
        run: nuget restore "Vigitemp Serveur/Vigitemp Serveur/packages.config" -PackagesDirectory "Vigitemp Serveur/packages"
      - name: Build VigiSensys Server
        shell: pwsh
        run: msbuild "Vigitemp Serveur/Vigitemp Serveur/VigitempServeur.csproj" /m /p:Configuration=Release
      - name: Build server installer
        shell: pwsh
        run: dotnet build "Vigitemp Serveur/VigitempServerInstaller/VigitempServerInstaller.csproj" -c Release
      - name: Check product versions
        shell: pwsh
        run: |
          Select-String -Path "Vigitemp Serveur/Vigitemp Serveur/Properties/AssemblyInfo.cs" -Pattern 'AssemblyInformationalVersion\("1\.2\.0"\)'
          Select-String -Path "Vigitemp Serveur/VigitempServerInstaller/VigitempServerInstaller.csproj" -Pattern '<Version>1\.2\.0</Version>'
