name: Temporary surveillance signaletics validation

on:
  push:
    branches:
      - fix/surveillance-cards-signaletique

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint targeted
        run: pnpm exec eslint "src/components/monitoring-card/monitoring-card-header.tsx" "src/messages/supplements.ts"
      - name: i18n check - no new debt in this lot
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "monitoring-card-header|src/messages/(fr|en)\.json|src/messages/supplements\.ts" /tmp/i18n-check.log; then
            echo "New i18n debt detected in files changed by this lot."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Global i18n checker still reports pre-existing debt outside this lot."
          fi
      - name: Generate Prisma clients
        run: pnpm prisma:generate:mysql
      - name: Production build
        run: pnpm build
