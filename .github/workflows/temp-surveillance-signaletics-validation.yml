name: Temporary surveillance signaletics validation

on:
  push:
    branches:
      - fix/surveillance-cards-signaletique

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm exec prettier --check "src/components/monitoring-card/monitoring-card-header.tsx" "src/messages/fr.json" "src/messages/en.json" "src/messages/supplements.ts" "package.json"
      - name: ESLint targeted
        run: pnpm exec eslint "src/components/monitoring-card/monitoring-card-header.tsx" "src/messages/supplements.ts"
      - name: i18n check
        run: pnpm i18n:check
      - name: Production build
        run: pnpm build
