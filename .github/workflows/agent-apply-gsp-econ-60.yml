name: Agent apply GSP ECON 60-char patch

on:
  push:
    branches:
      - agent/gsp-econ-60-char-limit

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gsp-econ-60-char-limit
          fetch-depth: 0

      - name: Validate patch
        run: git apply --check --recount .agent/gsp-econ-60.patch

      - name: Apply patch
        run: git apply --recount .agent/gsp-econ-60.patch

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Vigitemp Serveur/Vigitemp Serveur/sensors/GspProtocol.cs" \
                  "Vigitemp Serveur/Vigitemp Serveur/sensors/SensorGSP.cs" \
                  "Vigitemp Serveur/Vigitemp Serveur/HotlineApiServer.cs"
          git commit -m "fix(server): split GSP ECON commands at 60 chars"
          git push origin HEAD:agent/gsp-econ-60-char-limit
