name: Temporary surveillance timezone validation

on:
  push:
    branches:
      - fix/surveillance-measurement-timezone

permissions:
  contents: read

concurrency:
  group: temp-surveillance-timezone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: website
    env:
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/vigisensys
      DATABASE_MESURES_URL: mysql://root:password@127.0.0.1:3306/vigisensys_mesures
      DATABASE_CHAT_URL: mysql://root:password@127.0.0.1:3306/vigisensys_chat
      JWT_SECRET: temporary-ci-secret-that-is-long-enough-for-validation
      BETTER_AUTH_SECRET: temporary-ci-better-auth-secret-that-is-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD

      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Canonical date helper tests
        run: pnpm test:date-display

      - name: Surveillance measurement timezone contract
        run: pnpm test:surveillance-measurement-timezone

      - name: ESLint targeted
        run: >-
          pnpm exec eslint
          "src/lib/date-display.ts"
          "src/lib/measurements.ts"
          "src/lib/measurement-cache.ts"
          "src/components/monitoring-card.tsx"
          "src/components/monitoring-details/monitoring-graph-tab.tsx"
          "src/components/monitoring-details/monitoring-table-tab.tsx"
          "src/app/[locale]/(dashboard)/surveillance/_components/monitoring-site-section.tsx"
          "src/app/[locale]/(dashboard)/surveillance/monitoring-cards-grid.tsx"
          "src/app/[locale]/(dashboard)/surveillance/_components/curves-overlay-modal.tsx"
          "src/app/api/capteurs/paginated/route.ts"
          "src/app/api/tableau-de-bord/measurements/route.ts"
          "scripts/test-date-display.ts"
          "scripts/test-surveillance-measurement-timezone.ts"

      - name: TypeScript MySQL
        run: pnpm exec tsc --noEmit

      - name: i18n check (no new debt in changed sources)
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'monitoring-card|monitoring-graph-tab|monitoring-table-tab|monitoring-site-section|monitoring-cards-grid|curves-overlay-modal|date-display|measurements|measurement-cache|capteurs/paginated|tableau-de-bord/measurements' /tmp/i18n-check.log; then
            echo "New i18n debt detected in a changed source."
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "Global i18n checker still reports only pre-existing debt outside this lot."
          fi

      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql

      - name: TypeScript SQL Server
        run: pnpm exec tsc --noEmit

      - name: Restore Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Production build
        run: pnpm build
