name: Temporary Surveillance rolling graphs validation

on:
  push:
    branches:
      - feature/surveillance-rolling-graphs

permissions:
  contents: read

concurrency:
  group: temp-surveillance-rolling-graphs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: website
    env:
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/vigisensys
      DATABASE_MESURES_URL: mysql://root:password@127.0.0.1:3306/vigisensys_mesures
      DATABASE_CHAT_URL: mysql://root:password@127.0.0.1:3306/vigisensys_chat
      JWT_SECRET: temporary-ci-secret-that-is-long-enough-for-validation
      BETTER_AUTH_SECRET: temporary-ci-better-auth-secret-that-is-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD

      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Rolling graphs contract
        run: pnpm test:surveillance-rolling-graphs

      - name: ESLint targeted
        run: >-
          pnpm exec eslint
          "src/app/api/mesures/[idLieu]/route.ts"
          "src/components/monitoring-card.tsx"
          "src/components/monitoring-card/monitoring-card-chart-preview.tsx"
          "src/components/monitoring-card/monitoring-card-header.tsx"
          "src/components/monitoring-details-modal.tsx"
          "src/components/monitoring-details/monitoring-graph-tab.tsx"
          "src/components/monitoring-details/use-monitoring-range-measurements.ts"
          "src/components/ui/date-range-picker.tsx"
          "src/hooks/useLieuMeasurements.ts"
          "src/lib/measurement-downsampling.ts"
          "scripts/test-surveillance-rolling-graphs.ts"

      - name: TypeScript MySQL
        run: pnpm exec tsc --noEmit

      - name: i18n check
        run: pnpm i18n:check

      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql

      - name: TypeScript SQL Server
        run: pnpm exec tsc --noEmit

      - name: Restore Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Production build
        run: pnpm build
