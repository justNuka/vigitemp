name: Temporary DB 0.91.1 parity validation

on:
  push:
    branches:
      - fix/mssql-seed-parity

permissions:
  contents: read

concurrency:
  group: temp-db-0911-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff check
        run: git diff --check origin/dev...HEAD

      - name: Validate seed and migration parity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          mysql_seed = Path("db/vigisensys_seed.sql").read_text(encoding="utf-8-sig")
          mssql_seed = Path("db/vigisensys_seed_mssql.sql").read_text(encoding="utf-8-sig")
          mysql_migration = Path("db/migrations/0.91.1/mysql.sql").read_text(encoding="utf-8-sig")
          mssql_migration = Path("db/migrations/0.91.1/mssql.sql").read_text(encoding="utf-8-sig")

          columns = [
              "Consigne",
              "Consigne_Sup",
              "Consigne_Inf",
              "Tolerance_Surveillance_Sup",
              "Tolerance_Surveillance_Inf",
              "Consigne_Sup_Pre_Alarme",
              "Consigne_Inf_Pre_Alarme",
              "Seuil_Critique_Haut",
              "Seuil_Critique_Bas",
          ]

          for column in columns:
              assert f"`{column}` FLOAT DEFAULT NULL" in mysql_seed, column
              assert f"[{column}] FLOAT NULL" in mssql_seed, column
              assert f"MODIFY COLUMN `{column}` FLOAT DEFAULT NULL" in mysql_migration, column
              assert f"ALTER COLUMN [{column}] FLOAT NULL" in mssql_migration, column

          assert "-- Version produit / seed : 0.91.1" in mysql_seed
          assert "-- Version produit / seed : 0.91.1" in mssql_seed
          assert "SCHEMA_VERSION', '0.91.1'" in mysql_seed
          assert "SCHEMA_VERSION',N'0.91.1'" in mssql_seed
          assert "SCHEMA_VERSION', '0.91.1'" in mysql_migration
          assert "N'0.91.1'" in mssql_migration

          def mysql_trigger(text: str) -> str:
              marker = "/*!50003 CREATE*/ /*!50003 TRIGGER `TRG_GSO_BEF_UPD_LIEU_ALARME`"
              start = text.index(marker)
              end = text.index("\nDELIMITER ;", start)
              return text[start:end].strip()

          def mssql_trigger(text: str) -> str:
              marker = "CREATE OR ALTER TRIGGER dbo.[TRG_GSO_BEF_UPD_LIEU_ALARME]"
              start = text.index(marker)
              end = text.index("\nGO", start)
              return text[start:end].strip()

          mysql_seed_trigger = mysql_trigger(mysql_seed)
          mssql_seed_trigger = mssql_trigger(mssql_seed)
          assert "Seuil_Critique" not in mysql_seed_trigger
          assert "Seuil_Critique" not in mssql_seed_trigger
          def normalize_trigger(value: str) -> str:
              return "\n".join(line.rstrip() for line in value.splitlines()).strip()

          assert normalize_trigger(mysql_seed_trigger) == normalize_trigger(mysql_trigger(mysql_migration))
          assert normalize_trigger(mssql_seed_trigger) == normalize_trigger(mssql_trigger(mssql_migration))

          # The SQL Server cursor SELECT and both FETCH lists must stay aligned.
          select_match = re.search(
              r"DECLARE cur CURSOR LOCAL FAST_FORWARD FOR\s+SELECT\s+(.*?)\s+FROM inserted i;",
              mssql_seed_trigger,
              re.S,
          )
          assert select_match
          select_items = [
              line.strip().rstrip(",")
              for line in select_match.group(1).splitlines()
              if line.strip()
          ]

          fetch_matches = re.findall(
              r"FETCH NEXT FROM cur INTO\s+(.*?);",
              mssql_seed_trigger,
              re.S,
          )
          assert len(fetch_matches) == 2
          for fetch in fetch_matches:
              fetch_items = [item.strip() for item in fetch.split(",")]
              assert len(fetch_items) == len(select_items), (
                  len(select_items),
                  len(fetch_items),
              )

          # MySQL seed changes in this branch are version-only: functional
          # modifications were already committed by the user before this lot.
          diff = subprocess.run(
              ["git", "diff", "--unified=0", "origin/dev...HEAD", "--", "db/vigisensys_seed.sql"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          changed = [
              line for line in diff.splitlines()
              if (
                  line.startswith(("+", "-"))
                  and not line.startswith("+++ b/")
                  and not line.startswith("--- a/")
              )
          ]
          assert len(changed) == 4, changed
          assert any("Version produit / seed : 0.91.0" in line for line in changed)
          assert any("Version produit / seed : 0.91.1" in line for line in changed)
          assert any("SCHEMA_VERSION', '0.91.0'" in line for line in changed)
          assert any("SCHEMA_VERSION', '0.91.1'" in line for line in changed)

          print("DB 0.91.1 seed/migration parity: OK")
          PY
