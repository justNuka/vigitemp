name: Temp DB upgrade validation

on:
  push:
    branches:
      - chore/db-upgrade-scripts
    paths:
      - db/migrations/**
      - .github/workflows/_temp-db-upgrade-validation.yml

jobs:
  mysql-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL 8
        run: |
          docker run -d --name vigisensys-mysql \
            -e MYSQL_ROOT_PASSWORD=vigisensys_test \
            -p 3306:3306 \
            mysql:8.0
          for i in {1..60}; do
            if docker exec vigisensys-mysql mysqladmin ping -uroot -pvigisensys_test --silent; then
              exit 0
            fi
            sleep 2
          done
          docker logs vigisensys-mysql
          exit 1

      - name: Create 0.90.1 baseline
        run: |
          docker exec -i vigisensys-mysql mysql -uroot -pvigisensys_test <<'SQL'
          CREATE DATABASE vigi_main CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          USE vigi_main;
          CREATE TABLE t_utilisateur (
            Id_Utilisateur INT NOT NULL AUTO_INCREMENT,
            PRIMARY KEY (Id_Utilisateur)
          ) ENGINE=InnoDB;
          CREATE TABLE t_ajustage (
            Id_Ajustage INT NOT NULL AUTO_INCREMENT,
            Coeff_Constant FLOAT NULL,
            PRIMARY KEY (Id_Ajustage)
          ) ENGINE=InnoDB;
          CREATE TABLE t_parametre (
            Section VARCHAR(100) NOT NULL,
            Mot_Cle VARCHAR(100) NOT NULL,
            Valeur TEXT NULL,
            Commentaire TEXT NULL,
            PRIMARY KEY (Section, Mot_Cle)
          ) ENGINE=InnoDB;
          INSERT INTO t_parametre (Section, Mot_Cle, Valeur, Commentaire)
          VALUES ('VERSION', 'SCHEMA_VERSION', '0.90.1', 'baseline test');
          SQL

      - name: Apply MySQL migration twice
        run: |
          docker exec -i vigisensys-mysql mysql -uroot -pvigisensys_test < db/migrations/0.90.2/mysql.sql
          docker exec -i vigisensys-mysql mysql -uroot -pvigisensys_test < db/migrations/0.90.2/mysql.sql

      - name: Verify MySQL schema
        run: |
          result=$(docker exec vigisensys-mysql mysql -N -uroot -pvigisensys_test vigi_main -e "SELECT CONCAT((SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='vigi_main' AND table_name='t_ajustage' AND column_name='Coeffs_Modifies_Depuis_Derniere_Mesure'), '|', (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='vigi_main' AND table_name IN ('t_auth_user','t_auth_session','t_auth_account','t_auth_verification')), '|', (SELECT Valeur FROM t_parametre WHERE Section='VERSION' AND Mot_Cle='SCHEMA_VERSION'));" )
          echo "$result"
          test "$result" = "1|4|0.90.2"

  mssql-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start SQL Server 2022
        run: |
          docker run -d --name vigisensys-mssql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='VigiSensys_Test!2026' \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..90}; do
            if docker exec vigisensys-mssql bash -lc 'SQLCMD=$(command -v sqlcmd || true); if [ -z "$SQLCMD" ] && [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools18/bin/sqlcmd; fi; if [ -z "$SQLCMD" ] && [ -x /opt/mssql-tools/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi; [ -n "$SQLCMD" ] && "$SQLCMD" -S localhost -U sa -P "VigiSensys_Test!2026" -C -Q "SELECT 1" >/dev/null 2>&1'; then
              exit 0
            fi
            sleep 2
          done
          docker logs vigisensys-mssql
          exit 1

      - name: Resolve sqlcmd path
        run: |
          SQLCMD=$(docker exec vigisensys-mssql bash -lc 'command -v sqlcmd || ([ -x /opt/mssql-tools18/bin/sqlcmd ] && echo /opt/mssql-tools18/bin/sqlcmd) || ([ -x /opt/mssql-tools/bin/sqlcmd ] && echo /opt/mssql-tools/bin/sqlcmd)')
          echo "SQLCMD_PATH=$SQLCMD" >> "$GITHUB_ENV"

      - name: Create 0.90.1 baseline
        run: |
          docker exec -i vigisensys-mssql "$SQLCMD_PATH" -S localhost -U sa -P 'VigiSensys_Test!2026' -C -b <<'SQL'
          CREATE DATABASE [vigi_main];
          GO
          USE [vigi_main];
          GO
          CREATE TABLE dbo.t_utilisateur (
            Id_Utilisateur INT IDENTITY(1,1) NOT NULL PRIMARY KEY
          );
          CREATE TABLE dbo.t_ajustage (
            Id_Ajustage INT IDENTITY(1,1) NOT NULL PRIMARY KEY,
            Coeff_Constant FLOAT NULL
          );
          CREATE TABLE dbo.t_parametre (
            Section VARCHAR(100) NOT NULL,
            Mot_Cle VARCHAR(100) NOT NULL,
            Valeur NVARCHAR(MAX) NULL,
            Commentaire NVARCHAR(MAX) NULL,
            CONSTRAINT PK_t_parametre PRIMARY KEY (Section, Mot_Cle)
          );
          INSERT INTO dbo.t_parametre (Section, Mot_Cle, Valeur, Commentaire)
          VALUES ('VERSION', 'SCHEMA_VERSION', N'0.90.1', N'baseline test');
          GO
          SQL

      - name: Apply SQL Server migration twice
        run: |
          docker exec -i vigisensys-mssql "$SQLCMD_PATH" -S localhost -U sa -P 'VigiSensys_Test!2026' -C -b < db/migrations/0.90.2/mssql.sql
          docker exec -i vigisensys-mssql "$SQLCMD_PATH" -S localhost -U sa -P 'VigiSensys_Test!2026' -C -b < db/migrations/0.90.2/mssql.sql

      - name: Verify SQL Server schema
        run: |
          result=$(docker exec vigisensys-mssql "$SQLCMD_PATH" -S localhost -U sa -P 'VigiSensys_Test!2026' -C -h -1 -W -Q "SET NOCOUNT ON; USE [vigi_main]; SELECT CONCAT(CASE WHEN COL_LENGTH('dbo.t_ajustage','Coeffs_Modifies_Depuis_Derniere_Mesure') IS NULL THEN 0 ELSE 1 END, '|', (SELECT COUNT(*) FROM sys.tables WHERE name IN ('t_auth_user','t_auth_session','t_auth_account','t_auth_verification')), '|', (SELECT Valeur FROM dbo.t_parametre WHERE Section='VERSION' AND Mot_Cle='SCHEMA_VERSION'));" | tr -d '\r' | xargs)
          echo "$result"
          test "$result" = "1|4|0.90.2"
