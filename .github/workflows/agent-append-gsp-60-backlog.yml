name: Agent append GSP 60-char backlog

on:
  push:
    branches:
      - agent/gsp-econ-60-char-limit

permissions:
  contents: write

jobs:
  append-backlog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gsp-econ-60-char-limit
          fetch-depth: 0

      - name: Append backlog entry and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          file='website/docs/backlog-retours-17-08-2026.md'
          section='.agent/gsp-60-backlog-section.md'
          marker='## GSP — limite 60 caractères des commandes de configuration — 28/08/2026'
          if ! grep -Fq "$marker" "$file"; then
            cat "$section" >> "$file"
          fi
          rm -f "$section" '.github/workflows/agent-append-gsp-60-backlog.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: track GSP 60-character command limit'
          git push origin HEAD:agent/gsp-econ-60-char-limit
