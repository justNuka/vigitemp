name: Temporary Better Auth lockfile sync

on:
  push:
    branches:
      - feature/better-auth-foundation-poc

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Synchronize pnpm lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(auth): synchroniser le lockfile Better Auth"
          git push origin "HEAD:${GITHUB_REF_NAME}"
