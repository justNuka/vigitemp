name: Temporary BA-1 documentation finalization

on:
  push:
    branches:
      - feature/better-auth-foundation-poc

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update architecture documentation
        run: node .github/scripts/finalize-ba1-doc.mjs
      - name: Commit documentation update
        run: |
          if git diff --quiet -- docs/architecture/better-auth-migration.md; then
            echo "No documentation change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/better-auth-migration.md
          git commit -m "docs(auth): consigner le résultat du PoC BA-1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
