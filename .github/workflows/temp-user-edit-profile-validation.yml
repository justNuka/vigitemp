name: Temporary user edit profile validation

on:
  push:
    branches:
      - fix/user-edit-profile-selection

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql
      - name: User edit profile selection test
        run: pnpm test:user-edit-profile-selection
      - name: ESLint targeted
        run: pnpm exec eslint "src/app/[locale]/(admin)/admin/utilisateurs/_components/user-mappers.ts" "src/app/[locale]/(admin)/admin/utilisateurs/_components/edit-user-dialog.tsx" "src/app/[locale]/(admin)/admin/utilisateurs/users-client.tsx" "scripts/test-user-edit-profile-selection.ts"
      - name: i18n check
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "user-mappers|edit-user-dialog|users-client|test-user-edit-profile-selection" /tmp/i18n-check.log; then
            echo "New i18n debt detected in files changed by this lot."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Global i18n checker reports pre-existing debt outside this lot."
          fi
      - name: Production build - MySQL
        run: pnpm build
      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql
      - name: TypeScript - SQL Server
        run: pnpm exec tsc --noEmit
