name: temp validate localized reset footer

on:
  push:
    branches:
      - fix/localized-reset-and-app-footer

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients (MySQL)
        run: pnpm prisma:generate:mysql

      - name: Test localized public URLs
        run: pnpm exec tsx scripts/test-public-app-url.ts

      - name: ESLint changed files
        run: >-
          pnpm exec eslint
          "src/lib/public-app-url.ts"
          "src/app/api/auth/request-password-reset/route.ts"
          "src/app/api/utilisateurs/route.ts"
          "src/components/app-footer.tsx"
          "src/components/legal/public-info-page.tsx"
          "src/app/[locale]/legal-notice/page.tsx"
          "src/app/[locale]/data-protection/page.tsx"
          "src/app/[locale]/(dashboard)/dashboard-shell.tsx"
          "src/app/[locale]/(admin)/admin-layout-client.tsx"
          "src/i18n/request.ts"
          "src/i18n/routing.ts"
          "src/messages/legal-supplements.ts"
          "scripts/test-public-app-url.ts"

      - name: TypeScript (MySQL)
        run: pnpm exec tsc --noEmit

      - name: i18n audit
        continue-on-error: true
        run: pnpm i18n:check

      - name: Generate Prisma clients (SQL Server)
        run: pnpm prisma:generate:mssql

      - name: TypeScript (SQL Server)
        run: pnpm exec tsc --noEmit

      - name: Restore Prisma clients (MySQL)
        run: pnpm prisma:generate:mysql

      - name: Production build
        run: pnpm build
