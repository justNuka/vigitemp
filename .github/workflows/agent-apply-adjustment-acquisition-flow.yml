name: Agent apply adjustment acquisition flow

on:
  push:
    branches:
      - agent/adjustment-acquisition-stability-flow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adjustment-acquisition-stability-flow
          fetch-depth: 0

      - name: Apply verified transformations
        run: |
          set -euo pipefail
          python3 .agent/apply-adjustment-acquisition-flow.py
          git diff --check
          grep -Fq 'coefficientsLocked: boolean' 'website/src/lib/metrology-adjustment-session.ts'
          grep -Fq 'startAdjustmentPointAcquisition' 'website/src/lib/metrology-adjustment-session.ts'
          grep -Fq 'Lancer l’acquisition du premier point' 'website/src/messages/supplements.ts'
          ! grep -Fq 'previewReadingEnabled' 'website/src/app/[locale]/(admin)/admin/metrologie/realiser-ajustage/adjustment-workflow-client.tsx'

      - name: Commit source changes and clean agent files
        run: |
          set -euo pipefail
          rm -f '.agent/apply-adjustment-acquisition-flow.py' '.github/workflows/agent-apply-adjustment-acquisition-flow.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(metrology): pilot adjustment point acquisitions'
          git push origin HEAD:agent/adjustment-acquisition-stability-flow
