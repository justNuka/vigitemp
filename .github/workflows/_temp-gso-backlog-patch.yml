name: temp-gso-backlog-patch

on:
  push:
    branches:
      - "fix/gso-import-address-normalization"
    paths:
      - ".github/workflows/_temp-gso-backlog-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gso-import-address-normalization
          fetch-depth: 0

      - name: Update B20-002
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path("website/docs/backlog-retours-17-08-2026.md")
          text = path.read_text(encoding="utf-8-sig")
          start_marker = "## B20-002 — Import ajustage : identité d’une GSO simple capteur incorrecte"
          next_marker = "\n---\n\n## B20-003 — Export multiple des XML d’ajustage depuis les sondes"
          start = text.index(start_marker)
          end = text.index(next_marker, start)
          replacement = base64.b64decode("").decode("utf-8")

          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

      - name: Commit backlog update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/docs/backlog-retours-17-08-2026.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Backlog already up to date"
            exit 0
          fi
          git commit -m "docs(metrology): actualiser B20-002 pour les adresses GSO"
          git push origin HEAD:fix/gso-import-address-normalization
