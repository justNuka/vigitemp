name: Temporary location threshold preview validation

on:
  push:
    branches:
      - fix/location-threshold-preview-emt

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql
      - name: Location threshold preview / EMT tests
        run: pnpm test:location-threshold-preview-emt
      - name: Existing critical threshold regression
        run: pnpm test:location-critical-thresholds
      - name: Number display regression
        run: pnpm test:number-display
      - name: ESLint targeted
        run: pnpm exec eslint "src/lib/location-alarm-threshold-contract.ts" "src/app/[locale]/(admin)/admin/lieux/_components/location-form-schema.ts" "src/app/[locale]/(admin)/admin/lieux/_components/general-tab/location-setpoints-section.tsx" "src/app/[locale]/(admin)/admin/lieux/_components/general-tab/location-alarm-preview.tsx" "src/app/api/lieux/route.ts" "src/app/api/lieux/[id]/route.ts" "scripts/test-location-threshold-preview-emt.ts"
      - name: i18n check
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "location-alarm-threshold-contract|location-form-schema|location-setpoints-section|location-alarm-preview|test-location-threshold-preview-emt" /tmp/i18n-check.log; then
            echo "New i18n debt detected in files changed by this lot."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Global i18n checker reports pre-existing debt outside this lot."
          fi
      - name: Production build - MySQL
        run: pnpm build
      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql
      - name: TypeScript - SQL Server
        run: pnpm exec tsc --noEmit
