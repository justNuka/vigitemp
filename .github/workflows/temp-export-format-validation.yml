name: Temporary export format validation

on:
  push:
    branches:
      - feature/export-format-standardization

permissions:
  contents: read

concurrency:
  group: temp-export-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: website
    env:
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/vigisensys
      DATABASE_MESURES_URL: mysql://root:password@127.0.0.1:3306/vigisensys_mesures
      DATABASE_CHAT_URL: mysql://root:password@127.0.0.1:3306/vigisensys_chat
      JWT_SECRET: temporary-ci-secret-that-is-long-enough-for-validation
      BETTER_AUTH_SECRET: temporary-ci-better-auth-secret-that-is-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD

      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Export policy contract
        run: pnpm test:export-format-policy

      - name: ESLint targeted
        run: >-
          pnpm exec eslint
          "src/components/data-table/tanstack-table.tsx"
          "src/components/monitoring-details/monitoring-table-tab.tsx"
          "src/app/[locale]/(admin)/admin/audit/audit-client.tsx"
          "src/app/[locale]/(admin)/admin/etalons/_components/standard-measurements-table.tsx"
          "src/app/[locale]/(dashboard)/alarmes/acquittements/page-client.tsx"
          "src/app/[locale]/(admin)/admin/analyse-impact/impact-analysis-client.tsx"
          "src/app/[locale]/(admin)/admin/analyse-impact/_components/impact-alarms-table.tsx"
          "src/app/[locale]/(dashboard)/surveillance/_components/curves-overlay-modal.tsx"
          "src/components/services/VigilogPageClient.tsx"
          "src/components/services/vigilog/vigilog-tournee-detail-dialog.tsx"
          "scripts/test-export-format-policy.ts"

      - name: TypeScript MySQL
        run: pnpm exec tsc --noEmit

      - name: i18n check (no new debt in changed sources)
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'tanstack-table|monitoring-table-tab|analyse-impact|curves-overlay|vigilog-tournee-detail|alarmes/acquittements|admin/audit' /tmp/i18n-check.log; then
            echo "New i18n debt detected in a source changed by this lot."
            exit 1
          fi

          if grep -E '^  - (impactAnalysis|surveillance\.overlay|servicesVigilog\.detail|monitoringDetailsModal\.table)\.' /tmp/i18n-check.log; then
            echo "New i18n catalog mismatch detected in this lot."
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "Global i18n checker still reports only pre-existing debt outside this lot."
          fi

      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql

      - name: TypeScript SQL Server
        run: pnpm exec tsc --noEmit

      - name: Restore Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Production build
        run: pnpm build
