name: Temporary alarm email validation

on:
  push:
    branches:
      - fix/alarm-email-notifications

jobs:
  validate-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Alarm email tests
        run: pnpm test:alarm-email-notifications

      - name: ESLint targeted
        run: >-
          pnpm exec eslint
          "src/app/api/alarmes/dispatch/route.ts"
          "src/lib/alarm-email.ts"
          "emails/alarm-event-notification.tsx"
          "emails/critical-threshold-alarm-notification.tsx"
          "src/messages/admin-settings-supplements.ts"
          "scripts/test-alarm-email-notifications.tsx"

      - name: i18n check - no new debt in this lot
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "alarm-email|alarm-event-notification|critical-threshold-alarm-notification|admin-settings-supplements|src/messages/(fr|en)\.json" /tmp/i18n-check.log; then
            echo "New i18n debt detected in files changed by this lot."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Global i18n checker still reports pre-existing debt outside this lot."
          fi

      - name: Production build - MySQL
        run: pnpm build

      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql

      - name: TypeScript - SQL Server
        run: pnpm exec tsc --noEmit
