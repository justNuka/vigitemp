name: Temporary Pack One license access validation

on:
  push:
    branches:
      - fix/pack-one-license-access

permissions:
  contents: read

concurrency:
  group: temp-pack-one-license-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: website
    env:
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/vigisensys
      DATABASE_MESURES_URL: mysql://root:password@127.0.0.1:3306/vigisensys_mesures
      DATABASE_CHAT_URL: mysql://root:password@127.0.0.1:3306/vigisensys_chat
      JWT_SECRET: temporary-ci-secret-that-is-long-enough-for-validation
      BETTER_AUTH_SECRET: temporary-ci-better-auth-secret-that-is-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD

      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Pack One access contract
        run: pnpm test:pack-one-license-access

      - name: ESLint targeted
        run: >-
          pnpm exec eslint
          "src/lib/location-license-payload.ts"
          "src/lib/license-access.ts"
          "src/lib/license-email.ts"
          "src/app/[locale]/(admin)/admin/lieux/_components/location-form-dialog.tsx"
          "src/app/api/lieux/route.ts"
          "src/app/api/lieux/[id]/route.ts"
          "src/app/[locale]/(admin)/admin/lieux/locations-client.tsx"
          "src/app/[locale]/(dashboard)/surveillance/_components/page-client/use-surveillance-location-editor.ts"
          "src/lib/chat-guard.ts"
          "src/hooks/useMessagingEnabled.ts"
          "src/app/api/settings/messaging-enabled/route.ts"
          "src/lib/parameter-license-guards.ts"
          "src/app/[locale]/(admin)/admin/parametres/_components/settings-client.tsx"
          "src/components/upgrade/upgradeContent.ts"
          "scripts/smoke-license-matrix.ts"
          "scripts/test-pack-one-license-access.ts"

      - name: TypeScript MySQL
        run: pnpm exec tsc --noEmit

      - name: i18n check (no new debt in changed sources)
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'settings-client|upgradeContent|useMessagingEnabled|chat-guard|locations-client|use-surveillance-location-editor' /tmp/i18n-check.log; then
            echo "New i18n debt detected in a changed source."
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "Global i18n checker still reports only pre-existing debt outside this lot."
          fi

      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql

      - name: TypeScript SQL Server
        run: pnpm exec tsc --noEmit

      - name: Restore Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Production build
        run: pnpm build
