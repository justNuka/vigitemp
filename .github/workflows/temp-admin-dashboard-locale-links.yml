name: Temporary admin locale links validation

on:
  push:
    branches:
      - fix/admin-dashboard-locale-links

permissions:
  contents: read

concurrency:
  group: temp-admin-locale-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: website
    env:
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/vigisensys
      DATABASE_MESURES_URL: mysql://root:password@127.0.0.1:3306/vigisensys_mesures
      DATABASE_CHAT_URL: mysql://root:password@127.0.0.1:3306/vigisensys_chat
      JWT_SECRET: temporary-ci-secret-that-is-long-enough-for-validation
      BETTER_AUTH_SECRET: temporary-ci-better-auth-secret-that-is-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD

      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Admin dashboard locale link contract
        run: pnpm test:admin-dashboard-locale-links

      - name: ESLint targeted
        run: >-
          pnpm exec eslint
          "src/components/dashboard-link-card.tsx"
          "scripts/test-admin-dashboard-locale-links.ts"

      - name: TypeScript MySQL
        run: pnpm exec tsc --noEmit

      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql

      - name: TypeScript SQL Server
        run: pnpm exec tsc --noEmit

      - name: Restore Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Production build
        run: pnpm build
