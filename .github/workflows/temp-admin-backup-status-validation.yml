name: Temporary admin backup status validation

on:
  push:
    branches:
      - fix/admin-nav-backup-status

permissions:
  contents: read

concurrency:
  group: temp-admin-backup-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: website
    env:
      DATABASE_PROVIDER: mysql
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/vigisensys
      DATABASE_MESURES_URL: mysql://root:password@127.0.0.1:3306/vigisensys_mesures
      DATABASE_CHAT_URL: mysql://root:password@127.0.0.1:3306/vigisensys_chat
      JWT_SECRET: temporary-ci-secret-that-is-long-enough-for-validation
      BETTER_AUTH_SECRET: temporary-ci-better-auth-secret-that-is-long-enough
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diff check
        working-directory: .
        run: git diff --check origin/dev...HEAD

      - name: Generate Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Admin navigation and backup status contract
        run: pnpm test:admin-nav-backup-status

      - name: ESLint targeted
        run: >-
          pnpm exec eslint
          "src/components/admin-nav-dock.tsx"
          "src/lib/backup-log-parser.ts"
          "src/types/backup-types.ts"
          "src/app/api/admin/sauvegardes/route.ts"
          "src/app/[locale]/(admin)/admin/_components/admin-backup-status-summary.tsx"
          "src/app/[locale]/(admin)/admin/page.tsx"
          "src/app/[locale]/(admin)/admin/_components/expert-dashboard/expert-widget-card.tsx"
          "src/app/[locale]/(admin)/admin/_components/expert-dashboard/expert-widget-renderer.tsx"
          "src/app/[locale]/(admin)/admin/_components/expert-dashboard/expert-dashboard-types.ts"
          "scripts/test-admin-nav-backup-status.ts"

      - name: TypeScript MySQL
        run: pnpm exec tsc --noEmit

      - name: i18n check (no new debt in changed sources)
        shell: bash
        run: |
          set +e
          pnpm i18n:check 2>&1 | tee /tmp/i18n-check.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -E 'admin-nav-dock|backup-log-parser|admin-backup-status-summary|admin/sauvegardes|expert-widget-card|expert-widget-renderer|expert-dashboard-types|admin/page' /tmp/i18n-check.log; then
            echo "New i18n debt detected in a changed source."
            exit 1
          fi

          if [ "${status}" -ne 0 ]; then
            echo "Global i18n checker still reports only pre-existing debt outside this lot."
          fi

      - name: Generate Prisma SQL Server
        run: pnpm prisma:generate:mssql

      - name: TypeScript SQL Server
        run: pnpm exec tsc --noEmit

      - name: Restore Prisma MySQL
        run: pnpm prisma:generate:mysql

      - name: Production build
        run: pnpm build
